<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Under Construction | Zayaan Khandakar</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101418;
      color: #edf1ee;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 600px;
      padding: 32px;
    }

    h1 {
      color: #cdf86f;
      font-size: clamp(32px, 6vw, 48px);
    }

    p {
      color: #a7b1b6;
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border: 1px solid #cdf86f;
      border-radius: 6px;
      color: #cdf86f;
      text-decoration: none;
    }

    a:hover {
      background: #cdf86f;
      color: #101418;
    }
  </style>
</head>

<body>
  <main>
    <h1>Page Under Construction</h1>
  </main>
